[project]
name = "wwtw"
version = "0.1.0"
description = "Who Watches the Watcher? Context exposure and monitor-aware prompt injection in LLM agent monitors"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "agentdojo==0.1.35",
  "openai>=1.59.7,<4",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "click>=8.1",
  "psutil>=5.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
]

[project.scripts]
wwtw = "wwtw.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wwtw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests over all benchmark pairs"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`
