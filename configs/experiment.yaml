seed: 0
agent:
  model: gpt-4o-mini-2024-07-18
  temperature: 0.0
  benchmark_version: v1.2.2
  suites: [workspace, travel, banking, slack]
  attacks: [important_instructions, monitor_aware]
  max_injection_tasks_per_suite: null   # set by the pilot decision rule if needed
  workers: 4
pilot:
  benign_per_suite: 5
  user_tasks_per_suite: 5
  injection_tasks_per_suite: 2
  attack: important_instructions
  max_projected_usd: 18.0
monitor:
  long_leaf_chars: 120
  retest_fraction: 0.10
  models:
    - name: gpt-5-nano
      backend: openai
      model: gpt-5-nano-2025-08-07
      reasoning_effort: minimal
      json_mode: true
      max_output_tokens: 1000
      views: [V1, V2, V3, V4, V4raw]
      workers: 4
    - name: gpt-5-mini  # replaces the local llama3.2:3b arm (Amendment 1: it overheated the laptop)
      backend: openai
      model: gpt-5-mini-2025-08-07
      reasoning_effort: minimal
      json_mode: true
      max_output_tokens: 1000
      views: [V1, V3, V4]
      workers: 4
online:
  suite: banking
  attack: important_instructions
  monitor: gpt-5-nano
  view: V4
  fpr: 0.05
analysis:
  fpr_targets: [0.05, 0.10]
  primary_fpr: 0.05
  bootstrap_resamples: 10000
  descriptive_resamples: 2000
  noninferiority_margin: 0.05
budget:
  cap_usd: 20.0
  ledger_path: .state/ledger.sqlite
  prices:  # USD per 1M tokens
    gpt-4o-mini-2024-07-18: {input: 0.15, cached_input: 0.075, output: 0.60}
    gpt-5-nano-2025-08-07: {input: 0.05, cached_input: 0.005, output: 0.40}
    gpt-5-mini-2025-08-07: {input: 0.25, cached_input: 0.025, output: 2.00}
resources:
  min_free_disk_gb: 10
  min_available_ram_gb: 3
  min_available_ram_gb_local: 1.5
  ram_wait_seconds: 60
paths:
  runs: runs
  cache: .cache
  data: data
  results: results
